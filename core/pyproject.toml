[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sigpipe-core"
version = "0.1.0"
description = "sigpipe's compiled core: Rayleigh- and Love-wave dispersion curves of layered models, the seismic inversion's samplers, and the phase-shift transform"
readme = "README.md"
# The stable ABI (tool.maturin's abi3-py310): one wheel a platform, for CPython 3.10 on, as
# santiludo and silex need it, the coming versions included.
requires-python = ">=3.10"
# MIT, except src/surf96.rs: the BSD 3-Clause License of the code it derives from.
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-BSD-3-Clause"]
authors = [
    { name = "J. Cunha Teixeira", email = "jose.cunha-teixeira@protonmail.com" },
]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[tool.maturin]
features = ["extension-module", "pyo3/abi3-py310"]
module-name = "sigpipe_core"
