name: Core wheels

# sigpipe-core's prebuilt wheels (sigpipe's compiled core, core/), as santiludo's: one wheel per
# platform, built for the stable ABI (abi3), for CPython 3.10 and later, on Linux (x86_64,
# aarch64: PAC's Docker image on either), Windows (x64) and macOS (Apple Silicon, Intel), with its
# source distribution for any other platform (built there with Rust). They go to a GitHub Release
# and to the PEP 503 index on sigpipe's GitHub Pages, which the pyproject.toml of sigpipe,
# santiludo, silex and synthetics name: uv takes them from there when PAC or PACo install sigpipe,
# no Rust toolchain needed.
#
# A release, its version that of core/Cargo.toml and core/pyproject.toml:
#   git tag core-v0.1.0 && git push origin core-v0.1.0

on:
  push:
    tags:
      - "core-v*"
  workflow_dispatch:

jobs:
  wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: core
          command: build
          args: --release --out dist --interpreter 3.14
          # On Linux, in the manylinux_2_28 image, as santiludo's wheels.
          manylinux: "2_28"

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: core/dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: core
          command: sdist
          args: --out dist

      - name: Upload it
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: core/dist/*.tar.gz

  release:
    name: Publish to a GitHub Release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the wheels and the source distribution
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and upload them
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  publish_index:
    name: Publish the PEP 503 index to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the wheels and the source distribution
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check out the existing index (if any)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-old
        continue-on-error: true

      - name: Generate the PEP 503 index
        run: |
          python3 core/scripts/generate_pep503_index.py \
            "${{ github.repository }}" "${{ github.ref_name }}" \
            dist gh-pages-old public

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
