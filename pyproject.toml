[project]
name = "sigpipe"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "J. Cunha Teixeira", email = "jose.cunha-teixeira@protonmail.com" },
]
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "pandas",
    "obspy",
    "disba",
    "bayesbay",
]

[project.optional-dependencies]
beamforming = ["torch"]
silex = ["keras", "keras-nlp>=0.19.0", "torch>=2.13.0"]
santiludo = ["santiludo"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigpipe = ["py.typed"]


# -------------------------
# Santiludo: prebuilt-wheel index
# -------------------------
[[tool.uv.index]]
name = "santiludo"
url = "https://josecunhateixeira.github.io/santiludo/simple/"
explicit = true

[tool.uv.sources]
santiludo = { index = "santiludo" }


# -------------------------
# Pyright configuration
# -------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

include = ["src", "experiments"]

exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "**/node_modules",
    "**/.*",
]

reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false


# -------------------------
# Ruff configuration
# -------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RET", # flake8-return
    "PTH", # pathlib usage
    "NPY", # NumPy rules
    "RUF", # Ruff-specific rules
    "ANN", # annotations
    "ARG", # unused arguments
    "ERA", # commented-out code
]

ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sigpipe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


# -------------------------
# Pytest configuration
# -------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sigpipe --cov-report=term-missing"

[tool.coverage.run]
source = ["src/sigpipe"]
omit = ["*/algorithms/inversion/*", "*/algorithms/beamforming/*"]
